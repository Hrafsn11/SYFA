# Azure App Service Nginx Configuration - Optimized for Performance
# Tuned for B1 plan (1 core, 1.75GB RAM) with Livewire

server {
    # Listen on port 8080 as required by Azure App Service
    listen 8080;
    listen [::]:8080;

    # The document root
    root /home/site/wwwroot/public;
    index index.php index.html index.htm;

    server_name _;
    port_in_redirect off;

    # Allow larger file uploads (100MB)
    client_max_body_size 100M;

    # --- Performance: Gzip Compression ---
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_vary on;
    gzip_types
        application/javascript
        application/json
        application/xml
        application/rss+xml
        text/css
        text/javascript
        text/plain
        text/xml
        image/svg+xml;

    # --- Performance: Connection optimizations ---
    keepalive_timeout 30;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    # --- Performance: Static asset caching ---
    location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|woff|woff2|ttf|eot|webp)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # --- Livewire: Dedicated handling for faster poll/updates ---
    location /livewire {
        try_files $uri $uri/ /index.php$is_args$args;
    }

    location / {
        try_files $uri $uri/ /index.php$is_args$args;
    }

    # Block access to hidden files/directories
    location ~ /\.(?!well-known).* {
        deny all;
    }

    # Handle PHP files
    location ~ [^/]\.php(/|$) {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+?\.php)(|/.*)$;

        # PHP-FPM address for Azure App Service Linux
        fastcgi_pass 127.0.0.1:9000;

        include fastcgi_params;
        fastcgi_param HTTP_PROXY "";
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_param QUERY_STRING $query_string;
        fastcgi_intercept_errors on;

        # Timeouts - reduced from 3600s (too long, holds workers)
        fastcgi_connect_timeout 60;
        fastcgi_send_timeout 300;
        fastcgi_read_timeout 300;

        # Buffer sizes
        fastcgi_buffer_size 128k;
        fastcgi_buffers 4 256k;
        fastcgi_busy_buffers_size 256k;
        fastcgi_temp_file_write_size 256k;
    }
}
