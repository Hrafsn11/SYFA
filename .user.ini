; ===========================================
; PHP Configuration - Optimized for Azure B1
; ===========================================

; --- Upload limits ---
upload_max_filesize = 100M
post_max_size = 100M

; --- Memory: keep low so more PHP-FPM workers can run ---
; 128M per worker × 8 workers = 1GB (leaves room for OS + nginx + MySQL conn)
memory_limit = 128M

; --- OPcache: CRITICAL for performance ---
; Caches compiled PHP bytecode so files don't get re-parsed every request
opcache.enable = 1
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 10000
; Don't check file timestamps in production (faster)
opcache.validate_timestamps = 0
opcache.revalidate_freq = 0
; Save to shared memory for faster startup
opcache.save_comments = 1
opcache.enable_file_override = 1

; --- Realpath cache: reduces file stat() calls ---
realpath_cache_size = 4096K
realpath_cache_ttl = 600

; --- Session tuning ---
session.gc_maxlifetime = 3600
session.gc_probability = 1
session.gc_divisor = 100

; --- Execution limits ---
max_execution_time = 300
max_input_time = 300
max_input_vars = 5000

; --- Output buffering ---
output_buffering = 4096
